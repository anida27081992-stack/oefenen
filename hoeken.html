<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wiskunde: Hoeken</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f3ff;--ink:#17324d;--soft:#4b6580;--blue:#2a6fdb;--blue2:#1d57b3;--orange:#e8870a;--good:#1d8a4a;--goodbg:#dff3e6;--oops:#c0392b;--oopsbg:#fde7e3;--card:#fff;--line:#c4dcf2;--yel:#ffc533}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 Lexend,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 60px}
header.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.who{display:flex;align-items:center;gap:10px;font-weight:600;flex:1;min-width:140px}.who svg{width:44px;height:44px}
.chip{border:0;border-radius:999px;padding:8px 14px;font:600 14px Lexend,sans-serif;background:var(--blue);color:#fff;cursor:pointer;min-height:40px}
.chip.pts{background:var(--yel);color:#4a3200;cursor:default}
.prog{height:12px;border-radius:99px;background:#c4dcf2;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 18px 20px;margin-bottom:14px}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0 .4em}h2{font-size:1.4rem;margin:.2em 0 .5em}
p{margin:.5em 0}.note{color:var(--soft);font-size:.9rem}
.btn{border:0;border-radius:14px;padding:12px 20px;font:600 1.05rem Lexend,sans-serif;background:var(--blue);color:#fff;cursor:pointer;min-height:50px;box-shadow:0 3px 0 var(--blue2)}
.btn:active{transform:translateY(2px);box-shadow:none}.btn:disabled{opacity:.5;box-shadow:none;cursor:default}
.btn.alt{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:none}.btn.small{min-height:40px;padding:6px 14px;font-size:.95rem}
.btn.good{background:var(--good);box-shadow:0 3px 0 #146b37}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.row.sp{justify-content:space-between}
.qhead{display:flex;justify-content:space-between;color:var(--soft);font-size:.9rem;font-weight:600}
.q{font-size:1.2rem;font-weight:600}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}@media(min-width:520px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:600 1.05rem Lexend,sans-serif;color:var(--ink);cursor:pointer;text-align:left;min-height:52px}
.opt:hover{border-color:var(--blue)}.opt.ok{background:var(--goodbg);border-color:var(--good)}.opt.no{background:var(--oopsbg);border-color:var(--oops);opacity:.8}
.numin{display:flex;gap:10px;margin-top:12px}.numin input{font:700 1.6rem Lexend,sans-serif;width:140px;padding:8px 12px;border:3px solid var(--line);border-radius:14px;text-align:center;color:var(--ink)}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600}.fb.ok{background:var(--goodbg);color:#0f5a2c}.fb.no{background:var(--oopsbg);color:#7a2118}.fb.tip{background:#fff6d9;color:#5a4300;font-weight:400}
.say{background:#f1f7ff;border-left:5px solid var(--blue);border-radius:10px;padding:10px 14px;margin:12px 0}
.kw{background:#fff0b3;border-radius:6px;padding:0 6px;font-weight:700}
.big{font-weight:700;font-size:1.3em}
svg.fig,.geo svg{display:block;width:100%;max-width:560px;margin:8px auto;touch-action:manipulation}
.fig .vis{stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none}
.fig .pg{fill:#fff;stroke-linejoin:round}
.fig .lab{font:700 20px Lexend,sans-serif;fill:var(--ink)}.fig .lab.s{font-size:16px;fill:var(--soft)}
.fig .hit{stroke:transparent;stroke-width:26;fill:transparent;cursor:pointer;stroke-linecap:round}
.fig .dotv{fill:var(--ink)}.fig .rm{fill:none;stroke:var(--oops);stroke-width:2.5}
.fig .wedge{fill:rgba(42,111,219,.22);stroke:var(--blue);stroke-width:2}
.it{cursor:pointer}.it:hover .vis{stroke:var(--blue)}.it.sel .vis{stroke:var(--oops);stroke-width:7}.it.sel .pg{fill:#ffd9d4}.it.sel .dotv{fill:var(--oops)}
.it.show .vis{stroke:var(--good);stroke-width:7}.it.show .pg{fill:#c8efd5}.it.show .dotv{fill:var(--good)}
.geo .refl,.fig .refl{stroke:var(--blue);stroke-width:4;fill:none}
input[type=range]{width:100%;height:44px;accent-color:var(--blue)}
.geo{background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px}.geo svg{max-width:none;touch-action:none;user-select:none;-webkit-user-select:none}
.geo .tri{fill:rgba(120,190,255,.38);stroke:#2a6fdb;stroke-width:3;stroke-linejoin:round;cursor:grab}
.geo .ed{stroke:transparent;stroke-width:26;stroke-linecap:round;cursor:pointer}.geo .edv{stroke:#1d57b3;stroke-width:3;pointer-events:none}.geo .edv.al{stroke:var(--good);stroke-width:5}
.geo .arc{fill:none;stroke:#e5a400;stroke-width:3;pointer-events:none}.geo .tk{stroke:#1d57b3;stroke-width:1.5;pointer-events:none}
.geo .dr{stroke:var(--oops);stroke-width:3;stroke-linecap:round}.geo .rv{stroke:var(--good);stroke-width:4;stroke-dasharray:8 6}
.geo .rot{fill:var(--yel);stroke:#a97c00;stroke-width:2;cursor:grab}.geo text{pointer-events:none;font-family:Lexend,sans-serif}
.lv{display:grid;gap:10px;margin-top:10px}.lvb{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.lvb:hover{border-color:var(--blue)}.lvb b{display:block}.lvb small{color:var(--soft)}.lvn{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}.lvb.done .lvn{background:var(--good)}
.stars{font-size:2.4rem;text-align:center;letter-spacing:6px;color:#e5a400}
input.nm{font:600 1.2rem Lexend,sans-serif;width:100%;padding:12px;border:3px solid var(--line);border-radius:14px;color:var(--ink)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}.pop{animation:pop .35s}
.fig.clk{max-width:250px}.fig.clks,.fig.angset{max-width:600px}.fig.cmp{max-width:520px}.fig .it.sel .hit{fill:rgba(192,57,43,.08)}
</style></head><body><a href="index.html" style="display:inline-block;margin:10px 14px 0;color:#2a6fdb;font:700 15px/1.2 system-ui,sans-serif;text-decoration:none">← Alle lessen</a>
<div class="wrap">
<header class="bar" id="bar" hidden>
 <div class="who"><span id="av"></span><span id="nm"></span></div>
 <button class="chip" id="tv" type="button"></button><button class="chip" id="ts" type="button"></button><span class="chip pts" id="pt">0 punten</span>
</header>
<div class="prog" id="pg" hidden><i></i></div>
<main id="stage"></main>
</div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='wiskunde-hoeken51-v1';
let DB={name:'',res:{},voice:true,sound:true,explain:false};
try{const r=localStorage.getItem(KEY);if(r)DB=Object.assign(DB,JSON.parse(r));if(!DB.name){const o=JSON.parse(localStorage.getItem('wiskunde-hoeken-v1')||'null');if(o&&o.name)DB.name=o.name}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
/* ---------- geluid en stem ---------- */
let AC=null;
function tone(f,t,d,type,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.value=f;v.gain.setValueAtTime(0,AC.currentTime+t);v.gain.linearRampToValueAtTime(g||.12,AC.currentTime+t+.02);v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(v);v.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.05)}catch(e){}}
function sfx(k){if(!DB.sound)return;
  if(k==='ok'){[523,659,784].forEach((f,i)=>tone(f,i*.1,.25))}
  else if(k==='no'){tone(300,0,.18,'triangle',.08);tone(260,.14,.22,'triangle',.08)}
  else if(k==='tap')tone(620,0,.07,'sine',.07);
  else if(k==='snap')tone(880,0,.09,'triangle',.08);
  else if(k==='pen')tone(200,0,.12,'sawtooth',.04);
  else if(k==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.3))}}
let VOICE=null;
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
function speak(t){if(!DB.voice||!t)return;try{stopSpeech();const u=new SpeechSynthesisUtterance(t);u.lang='nl-NL';u.rate=.85;const vs=speechSynthesis.getVoices().filter(v=>/^nl/i.test(v.lang));if(vs[0])u.voice=vs[0];speechSynthesis.speak(u)}catch(e){}}
function listenBtn(t){const b=document.createElement('button');b.type='button';b.className='btn alt small';b.textContent='\u{1F50A} Lees voor';b.onclick=()=>{const was=DB.voice;DB.voice=true;speak(t);DB.voice=was};return b}
function mascot(){return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#ffc533" stroke="#c98f00" stroke-width="4"/><circle cx="35" cy="42" r="6" fill="#17324d"/><circle cx="65" cy="42" r="6" fill="#17324d"/><path d="M28 62q22 22 44 0" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round"/></svg>'}
/* ---------- rekenhulp ---------- */
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const norm180=a=>((a%180)+180)%180;
function angDiff180(a,b){const d=Math.abs(norm180(a)-norm180(b));return Math.min(d,180-d)}
const dirv=a=>[Math.cos(rad(a)),Math.sin(rad(a))];
const sgnDist=(p,o,a)=>{const u=dirv(a);return -(p[0]-o[0])*u[1]+(p[1]-o[1])*u[0]};   // + = rechts van de lijn (scherm)
const lineDist=(p,o,a)=>Math.abs(sgnDist(p,o,a));
function clipLine(p,a,W,H){const u=dirv(a);let t0=-1e9,t1=1e9;
  [[0,W],[1,H]].forEach(([i,m])=>{if(Math.abs(u[i])<1e-9){return}const s=(0-p[i])/u[i],e=(m-p[i])/u[i];t0=Math.max(t0,Math.min(s,e));t1=Math.min(t1,Math.max(s,e))});
  return [[p[0]+u[0]*t0,p[1]+u[1]*t0],[p[0]+u[0]*t1,p[1]+u[1]*t1]]}
const unit=(a,b)=>{const d=dist(a,b)||1;return [(b[0]-a[0])/d,(b[1]-a[1])/d]};
/* ---------- figuren ---------- */
const svgWrap=(w,h,inner,cls)=>'<svg class="fig '+(cls||'')+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Figuur">'+inner+'</svg>';
function segm(id,a,b,o){o=o||{};const l=(c,x)=>'<line class="'+c+'" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"'+(x||'')+'/>';
  const st=o.col?' style="stroke:'+o.col+(o.w?';stroke-width:'+o.w:'')+'"':'';
  return id?'<g class="it" data-id="'+id+'">'+l('vis',st)+l('hit')+'</g>':l('vis',st)}
function dot(id,p,r){r=r||6;const c='<circle class="dotv" cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'"/>';
  return id?'<g class="it" data-id="'+id+'"><circle class="hit" cx="'+p[0]+'" cy="'+p[1]+'" r="20"/>'+c+'</g>':c}
const lab=(t,p,an,cl)=>'<text class="lab '+(cl||'')+'" x="'+p[0]+'" y="'+p[1]+'" text-anchor="'+(an||'middle')+'">'+t+'</text>';
function poly(id,pts,o){o=o||{};const g='<polygon class="vis pg" points="'+pts.map(p=>p.join(',')).join(' ')+'"'+(o.fill?' style="fill:'+o.fill+'"':'')+'/>';return id?'<g class="it" data-id="'+id+'">'+g+'</g>':g}
function rmark(P,u,v,s){s=s||15;const a=[P[0]+u[0]*s,P[1]+u[1]*s],b=[a[0]+v[0]*s,a[1]+v[1]*s],c=[P[0]+v[0]*s,P[1]+v[1]*s];return '<path class="rm" d="M'+a+' L'+b+' L'+c+'"/>'}
function tickMark(a,b,n){const m=[(a[0]+b[0])/2,(a[1]+b[1])/2],u=unit(a,b),nv=[-u[1],u[0]];let s='';for(let i=0;i<n;i++){const o=(i-(n-1)/2)*7;s+='<line class="rm" x1="'+(m[0]+u[0]*o+nv[0]*8)+'" y1="'+(m[1]+u[1]*o+nv[1]*8)+'" x2="'+(m[0]+u[0]*o-nv[0]*8)+'" y2="'+(m[1]+u[1]*o-nv[1]*8)+'"/>'}return s}
function angPt(V,ang,len){return [V[0]+len*Math.cos(rad(ang)),V[1]-len*Math.sin(rad(ang))]}
function wedge(V,a0,a1,r){const p0=angPt(V,a0,r),p1=angPt(V,a1,r);return '<path class="wedge" d="M'+V+' L'+p0+' A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 0 '+p1+' Z"/>'}
function angFig(a,o){o=o||{};const V=[70,170],r=o.r||150;
  return svgWrap(300,200,wedge(V,0,a,o.wr||44)+segm(null,V,angPt(V,0,r))+segm(null,V,angPt(V,a,r))+dot(null,V)+(o.lab?lab(o.lab,[V[0]-4,V[1]+28]):''),'ang')}
/* ---------- vaste figuren ---------- */
const FP={F:[50,50],E:[180,50],D:[310,50],A:[50,170],B:[180,170],C:[310,170]};
function fenceFig(){const P=FP;let s='';
  [['AC','A','C'],['DF','F','D'],['AF','A','F'],['BE','B','E'],['CD','C','D'],['AE','A','E'],['BF','B','F'],['BD','B','D'],['CE','C','E']].forEach(([id,a,b])=>s+=segm(id,P[a],P[b]));
  return svgWrap(360,220,s+Object.keys(P).map(k=>dot(null,P[k],5)).join('')+lab('F',[34,42])+lab('E',[180,36])+lab('D',[326,42])+lab('A',[34,196])+lab('B',[180,198])+lab('C',[326,196]),'fence')}
const TZ={A:[50,170],B:[260,170],C:[260,50],D:[120,50]};
function trapFig(o){o=o||{};const P=TZ;let s='';
  [['AB','A','B'],['BC','B','C'],['CD','C','D'],['AD','A','D']].forEach(([id,a,b])=>s+=segm(o.pick?id:null,P[a],P[b]));
  s+=rmark(P.B,[-1,0],[0,-1])+rmark(P.C,[-1,0],[0,1]);
  return svgWrap(320,220,s+lab('A',[34,196])+lab('B',[272,196])+lab('C',[276,42])+lab('D',[108,40]),'trap')}
const RC={A:[60,170],B:[260,170],C:[260,60],D:[60,60]};
function rectFig(o){o=o||{};const P=RC;let s='';
  [['AB','A','B'],['BC','B','C'],['CD','C','D'],['AD','A','D']].forEach(([id,a,b])=>s+=segm(o.pick?id:null,P[a],P[b]));
  if(o.diag)[['AC','A','C'],['BD','B','D']].forEach(([id,a,b])=>s+=segm(o.pick?id:null,P[a],P[b],{col:o.pick?null:'#e8870a'}));
  if(o.right)Object.keys(P).forEach(k=>{});
  return svgWrap(320,220,s+lab('A',[44,196])+lab('B',[276,196])+lab('C',[278,50])+lab('D',[44,50]),'rect')}
function twoLines(a1,a2,o){o=o||{};const C=[160,100],l=(a,id,c)=>{const e1=[C[0]+130*Math.cos(rad(a)),C[1]-130*Math.sin(rad(a))],e2=[C[0]-130*Math.cos(rad(a)),C[1]+130*Math.sin(rad(a))];return segm(null,e1,e2,{col:c})};
  return svgWrap(320,200,l(a1,'p','#2a6fdb')+l(a2,'q','#e8870a')+lab('p',angPt(C,a1,146),'middle')+lab('q',angPt(C,a2,146),'middle'),'two')}
function parLines(tilt){return svgWrap(320,170,segm(null,[30,50],[290,50],{col:'#2a6fdb'})+segm(null,[30,125+tilt*-0],[290,125-tilt],{col:'#e8870a'})+lab('p',[16,56],'middle')+lab('q',[16,131],'middle'),'two')}
/* ---------- eenvoudige vraagonderdelen ---------- */
function mcW(box,opts,correct,check,o){o=o||{};
  box.innerHTML='<div class="opts '+(o.two?'two':'')+'">'+opts.map(v=>'<button class="opt" type="button" data-v="'+esc(v)+'">'+v+'</button>').join('')+'</div>';
  const bs=$$('.opt',box);
  bs.forEach(b=>b.onclick=()=>{sfx('tap');const ok=b.dataset.v===String(correct);b.classList.add(ok?'ok':'no');b.disabled=true;check(ok);if(ok)bs.forEach(x=>x.disabled=true)});
  return {reveal(){bs.forEach(b=>{b.disabled=true;if(b.dataset.v===String(correct))b.classList.add('ok')})}}}
function numW(box,correct,check,unit){
  box.innerHTML='<div class="numin"><input id="nv" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Jouw antwoord"><button class="btn" id="nk" type="button">Klaar</button></div>'+(unit?'<p class="note">'+unit+'</p>':'');
  const i=$('#nv',box),b=$('#nk',box);
  const go=()=>{const t=i.value.trim();if(!t)return;const ok=Number(t)===correct;check(ok);if(!ok)i.select()};
  b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>{try{i.focus({preventScroll:true})}catch(e){}},60);
  return {reveal(){i.value=correct;i.disabled=true;b.disabled=true}}}
function pickW(box,svg,okf,check,answer,extra){
  box.innerHTML=svg+'<div class="row"><button class="btn" id="pk" type="button">Klaar</button><button class="btn alt small" id="pc" type="button">Wis keuze</button></div>';
  const sel=new Set(),items=$$('.it',box);
  items.forEach(g=>g.addEventListener('click',()=>{sfx('tap');const id=g.dataset.id;if(sel.has(id)){sel.delete(id);g.classList.remove('sel')}else{sel.add(id);g.classList.add('sel')}}));
  $('#pc',box).onclick=()=>{sel.clear();items.forEach(g=>g.classList.remove('sel'))};
  $('#pk',box).onclick=()=>{if(!sel.size)return;check(okf(sel))};
  return {reveal(){items.forEach(g=>{g.classList.remove('sel');if(answer.includes(g.dataset.id))g.classList.add('show')});$('#pk',box).disabled=true}}}
const sameSet=(s,arr)=>s.size===arr.length&&arr.every(x=>s.has(x));
/* ---------- klokken ---------- */
const pad2=n=>(n<10?'0':'')+n;
const timeText=(h,m)=>m===0?h+' uur':h+':'+pad2(m);
const hourAng=(h,m)=>(h%12)*30+m*.5, minAng=m=>m*6;
const clkPt=(a,r,C)=>[(C||100)+r*Math.sin(rad(a)),(C||100)-r*Math.cos(rad(a))];
function clockAngle(h,m){const d=Math.abs(hourAng(h,m)-minAng(m))%360;return Math.min(d,360-d)}
function clockInner(h,m,o){o=o||{};let s='<circle class="vis pg" cx="100" cy="100" r="86" style="stroke-width:5"/>';
  for(let i=0;i<12;i++){const a=i*30,p1=clkPt(a,i%3?72:66),p2=clkPt(a,79);s+='<line x1="'+p1[0]+'" y1="'+p1[1]+'" x2="'+p2[0]+'" y2="'+p2[1]+'" stroke="#17324d" stroke-width="'+(i%3?2:4)+'"/>'}
  [[12,0],[3,90],[6,180],[9,270]].forEach(([n,a])=>{const p=clkPt(a,52);s+='<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#17324d" style="font-family:Lexend,sans-serif">'+n+'</text>'});
  const ah=hourAng(h,m),am=minAng(m);
  if(o.arc!==false){let d=((am-ah+540)%360)-180;if(Math.abs(d)>0.5){const r=30,p0=clkPt(ah,r),p1=clkPt(ah+d,r);
    s+='<path d="M100 100 L'+p0+' A'+r+' '+r+' 0 0 '+(d>0?1:0)+' '+p1+' Z" fill="rgba(192,57,43,.18)" stroke="#c0392b" stroke-width="3"/>'}}
  const ph=clkPt(ah,44),pm=clkPt(am,66);
  s+='<line x1="100" y1="100" x2="'+ph[0]+'" y2="'+ph[1]+'" stroke="#e8870a" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="100" x2="'+pm[0]+'" y2="'+pm[1]+'" stroke="#2a6fdb" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#17324d"/>';
  return s}
const clockFig=(h,m,o)=>svgWrap(200,200,clockInner(h,m,o),'clk');
function clocksFig(list,cols,o){o=o||{};cols=cols||list.length;const rows=Math.ceil(list.length/cols);let s='';

QS.forEach((q,i)=>{q.id=i+1;q.tip=LV[q.lv-1].tip});
console.assert(QS.length===60,'aantal vragen '+QS.length);
/* ---------- scherm en spelverloop ---------- */
const MAXT=3,stage=()=>$('#stage');
const speakText=h=>{const d=document.createElement('div');d.innerHTML=h;let t=d.textContent.replace(/∠/g,'hoek').replace(/⊥/g,'loodrecht').replace(/∥/g,'evenwijdig').replace(/°/g,' graden').replace(/\s+/g,' ').trim();return t};
const total=()=>Object.values(DB.res).reduce((s,r)=>s+(r.pts||0),0);
const lvStat=l=>{let n=0,p=0;for(let i=1;i<=10;i++){const r=DB.res[(l-1)*10+i];if(r){n++;p+=r.pts||0}}return {n,p}};
function topbar(){const on=!!DB.name;$('#bar').hidden=!on;if(!on)return;$('#av').innerHTML=mascot();$('#av svg').style.cssText='width:44px;height:44px';$('#nm').textContent=DB.name;
  $('#tv').textContent='Lees voor: '+(DB.voice?'aan':'uit');$('#ts').textContent='Geluid: '+(DB.sound?'aan':'uit');$('#pt').textContent=total()+' punten'}
function prog(f){const p=$('#pg');p.hidden=f==null;if(f!=null)$('i',p).style.width=Math.round(f*100)+'%'}
$('#tv').onclick=()=>{DB.voice=!DB.voice;if(!DB.voice)stopSpeech();save();topbar()};
$('#ts').onclick=()=>{DB.sound=!DB.sound;save();topbar();sfx('tap')};
function go(html){stopSpeech();stage().innerHTML=html;window.scrollTo(0,0)}
function showLogin(){prog(null);topbar();
  go('<section class="card"><div style="width:90px;margin:0 auto">'+mascot()+'</div><h1 style="text-align:center">Hoeken</h1><p style="text-align:center">Schrijf hier je naam.</p><input class="nm" id="nin" type="text" maxlength="40" autocomplete="off" aria-label="Je naam"><div class="row" style="justify-content:center"><button class="btn" id="nok" type="button">Start</button></div></section>');
  const i=$('#nin'),ok=()=>{const v=i.value.trim();if(!v){i.focus();return}DB.name=v;save();sfx('tap');showHome()};
  $('#nok').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()}}
function showHome(){topbar();prog(null);
  let h='<section class="card"><h1>Hoi '+esc(DB.name)+'!</h1><p>Wiskunde: <b>hoeken</b>. Je leert wat een hoek is, hoe je een hoek opschrijft en hoe je hoeken met elkaar vergelijkt.</p><div class="row"><button class="btn" id="hx" type="button">'+(DB.explain?'Uitleg opnieuw':'Start met de uitleg')+'</button></div></section>';
  h+='<section class="card"><h2>De 60 vragen</h2><p class="note">Zes delen van 10 vragen. Je hebt nu '+total()+' van 60 punten.</p><div class="lv">';
  LV.forEach((l,i)=>{const s=lvStat(i+1);h+='<button class="lvb'+(s.n===10?' done':'')+'" type="button" data-l="'+(i+1)+'"><span class="lvn">'+(s.n===10?'✓':i+1)+'</span><span><b>'+l.t+'</b><small>'+l.s+' · '+s.n+'/10 gedaan, '+s.p+' punten</small></span></button>'});
  h+='</div></section><section class="card"><div class="row"><button class="btn alt small" id="hr" type="button">Mijn resultaten</button></div></section>';
  go(h);$('#hx').onclick=()=>showExplain(0);$$('.lvb').forEach(b=>b.onclick=()=>{const l=+b.dataset.l,s=lvStat(l);startLevel(l,s.n>=10?0:s.n)});$('#hr').onclick=showResults}
function showExplain(i){const e=EX[i],N=EX.length;prog((i+1)/N);const sp=e.speak(DB.name);
  go('<section class="card explain"><div class="qhead"><span>Uitleg '+(i+1)+' van '+N+'</span></div><h2>'+e.t+'</h2>'+e.html(DB.name)+'<div class="row sp"><span id="lb"></span><div class="row" style="margin:0">'+(i?'<button class="btn alt" id="bk" type="button">Terug</button>':'')+'<button class="btn" id="nx" type="button">'+(i===N-1?'Start de vragen':'Verder')+'</button></div></div></section>');
  $('#lb').appendChild(listenBtn(sp));if(e.mount)e.mount($('.explain'));
  $('#nx').onclick=()=>{sfx('tap');if(i===N-1){DB.explain=true;save();startLevel(1,lvStat(1).n>=10?0:lvStat(1).n)}else showExplain(i+1)};
  const bk=$('#bk');if(bk)bk.onclick=()=>showExplain(i-1);if(DB.voice)setTimeout(()=>speak(sp),300)}
let CUR=null;
function startLevel(l,idx){CUR={l,idx:Math.min(idx,9)};showQ()}
function showQ(){const {l,idx}=CUR,q=QS[(l-1)*10+idx];CUR.q=q;CUR.tries=0;CUR.done=false;prog(idx/10);topbar();
  const sp=speakText(q.prompt)+(q.fig?' Kijk naar de figuur.':'');
  go('<section class="card"><div class="qhead"><span>Vraag '+(idx+1)+' van 10</span><span>'+LV[l-1].t+'</span></div><div class="row sp" style="align-items:flex-start"><div style="flex:1;min-width:200px">'+q.prompt+'</div><span id="lb"></span></div><div id="qa"></div><div id="fb"></div><div class="row" id="nxr" hidden><button class="btn good" id="nx" type="button">'+(idx===9?'Klaar met dit deel':'Volgende vraag')+'</button></div></section>');
  $('#lb').appendChild(listenBtn(sp));
  CUR.w=q.build($('#qa'),check);if(DB.voice)setTimeout(()=>speak(sp),250);
  $('#nx').onclick=()=>{sfx('tap');if(idx===9)showLevelResult();else{CUR.idx++;showQ()}}}
function check(ok){if(CUR.done)return;const q=CUR.q,fb=$('#fb');
  const rec=pts=>{DB.res[q.id]={pts,tries:CUR.tries+(ok?0:1),ok:ok?1:0};save();topbar()};
  if(ok){CUR.done=true;const first=CUR.tries===0;rec(first?1:0);sfx('ok');fb.innerHTML='<div class="fb ok pop">'+(first?'Goed! Je krijgt 1 punt.':'Goed! Nu heb je het gevonden. Deze keer geen punt, want je had het niet de eerste keer goed.')+'</div>';$('#nxr').hidden=false;$('#nx').focus&&0;return}
  CUR.tries++;sfx('no');
  if(CUR.tries>=MAXT){CUR.done=true;DB.res[q.id]={pts:0,tries:CUR.tries,ok:0};save();topbar();if(CUR.w&&CUR.w.reveal)CUR.w.reveal();
    fb.innerHTML='<div class="fb no">Dat was het niet. Het goede antwoord: <b>'+q.ans+'</b></div><div class="fb tip">'+q.tip+'</div>';$('#nxr').hidden=false;return}
  fb.innerHTML='<div class="fb no">Nog niet goed. Probeer het nog een keer.</div>'+(CUR.tries>=2?'<div class="fb tip">'+q.tip+'</div>':'')}
function showLevelResult(){const l=CUR.l,s=lvStat(l);prog(1);const st=s.p>=9?3:s.p>=7?2:s.p>=4?1:0;sfx('win');
  go('<section class="card"><div style="width:90px;margin:0 auto">'+mascot()+'</div><h1 style="text-align:center">'+LV[l-1].t+' klaar!</h1><div class="stars" aria-label="'+st+' van 3 sterren">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div><p style="text-align:center" class="big">'+s.p+' van 10 punten</p><p style="text-align:center">'+(s.p>=9?'Fantastisch!':s.p>=7?'Heel goed gedaan!':s.p>=4?'Goed bezig! Oefenen helpt.':'Je hebt hard gewerkt. Probeer het nog een keer.')+'</p><div class="row" style="justify-content:center">'+(l<6?'<button class="btn" id="nl" type="button">Volgend deel</button>':'')+'<button class="btn alt" id="hm" type="button">Terug naar het begin</button></div></section>');
  const nl=$('#nl');if(nl)nl.onclick=()=>startLevel(l+1,lvStat(l+1).n>=10?0:lvStat(l+1).n);$('#hm').onclick=showHome}
function showResults(){prog(null);let h='<section class="card"><h2>Mijn resultaten</h2><p><b>'+esc(DB.name)+'</b>: '+total()+' van 60 punten.</p>';
  LV.forEach((l,i)=>{const s=lvStat(i+1);h+='<p>'+(i+1)+'. '+l.t+': <b>'+s.p+'</b> punten ('+s.n+'/10 gedaan)</p>'});
  h+='<div class="row"><button class="btn" id="csv" type="button">Download als bestand (CSV)</button><button class="btn alt" id="bk" type="button">Terug</button></div><p class="note">Alles wordt bewaard in deze browser. Wil je opnieuw beginnen?</p><div class="row"><button class="btn alt small" id="rs" type="button">Alles wissen en opnieuw beginnen</button></div></section>';
  go(h);$('#bk').onclick=showHome;
  $('#csv').onclick=()=>{const rows=[['naam','vraag','deel','punten','pogingen','goed']];QS.forEach(q=>{const r=DB.res[q.id];if(r)rows.push([DB.name,q.id,LV[q.lv-1].t,r.pts,r.tries,r.ok])});
    const blob=new Blob(['﻿'+rows.map(r=>r.join(';')).join('\r\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hoeken-'+DB.name.replace(/\W+/g,'_')+'.csv';a.click()};
  $('#rs').onclick=()=>{if(confirm('Alle antwoorden wissen?')){DB.res={};DB.explain=false;save();showHome()}}}
if(DB.name)showHome();else showLogin();
</script></body></html>
