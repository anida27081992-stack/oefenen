<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Uitslag, ribben en aanzichten</title>

<style>
/* Layout: één smalle kolom, één stap per scherm. Blauw = theorie, groen = voorbeeld, roze/groen/geel = kleuren van de grensvlakken, oranje = geteld. */
:root{
  --bg:#eef5ff; --surface:#ffffff; --ink:#10253f; --muted:#4a5f7a; --line:#c9d9ee;
  --blue:#1c6df2; --blue-d:#1450b8; --on-blue:#ffffff; --blue-soft:#dcebff;
  --teal:#0aa384; --teal-d:#067a63; --on-teal:#ffffff; --teal-soft:#d3f3ea;
  --hot:#d9480f; --hot-soft:#ffe6da;
  --sun:#ffc531; --bad:#c2381f; --bad-soft:#ffe2dc;
  --fig:#b7c9f2; --figline:#1d4f9c;
  --c1:#ef9aa8; --c2:#7fcfbf; --c3:#ffd98a;
  --cube-top:#ffe3a3; --cube-front:#f6c35c; --cube-right:#e0a032; --floor:#cfe0f7;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1626; --surface:#15233a; --ink:#e8f0fc; --muted:#a3b6d1; --line:#2a3d5c;
    --blue:#6ea4ff; --blue-d:#3f73c9; --on-blue:#08142a; --blue-soft:#1b3157;
    --teal:#2fd1ac; --teal-d:#2fd1ac; --on-teal:#062b24; --teal-soft:#10403a;
    --hot:#ff9a6b; --hot-soft:#4a2616;
    --sun:#ffd25c; --bad:#ff8a73; --bad-soft:#4a2019;
    --fig:#3d5a94; --figline:#a9c4f5;
    --c1:#c0566b; --c2:#2f9582; --c3:#c99a2e;
    --cube-top:#e3b552; --cube-front:#b9862a; --cube-right:#8a6119; --floor:#223a5e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1626; --surface:#15233a; --ink:#e8f0fc; --muted:#a3b6d1; --line:#2a3d5c;
  --blue:#6ea4ff; --blue-d:#3f73c9; --on-blue:#08142a; --blue-soft:#1b3157;
  --teal:#2fd1ac; --teal-d:#2fd1ac; --on-teal:#062b24; --teal-soft:#10403a;
  --hot:#ff9a6b; --hot-soft:#4a2616;
  --sun:#ffd25c; --bad:#ff8a73; --bad-soft:#4a2019;
  --fig:#3d5a94; --figline:#a9c4f5;
  --c1:#c0566b; --c2:#2f9582; --c3:#c99a2e;
  --cube-top:#e3b552; --cube-front:#b9862a; --cube-right:#8a6119; --floor:#223a5e;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.55;
  padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,7vw,3.2rem)}
h2{font-size:clamp(1.6rem,5vw,2.1rem)}
h3{font-size:1.5rem}
p{margin:0}
b{font-weight:800}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.brand{font:700 1rem var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.95rem;font-weight:600}
.tools label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tools input{width:20px;height:20px;accent-color:var(--blue)}
.pts{background:var(--sun);color:#3d2d00;border-radius:99px;padding:2px 14px;font-weight:800}
.prog{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
#bar{display:block;height:100%;width:0;background:var(--teal);transition:width .4s}
.stepname{font-size:.95rem;font-weight:600;color:var(--muted)}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.center{align-items:center;text-align:center}
#stage{outline:none}
#stage>*{animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.theory,.example{position:relative;border:2px solid;border-radius:6px 14px 14px 14px;padding:46px 18px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;width:100%}
.theory{background:var(--blue-soft);border-color:var(--blue)}
.example{background:var(--teal-soft);border-color:var(--teal-d);align-items:stretch}
.tab{position:absolute;top:-2px;left:-2px;padding:3px 16px;border-radius:6px 0 12px 0;font:700 .95rem var(--font-display);letter-spacing:.05em;background:var(--blue);color:var(--on-blue)}
.example .tab{background:var(--teal-d);color:var(--on-teal)}
.theory p{text-align:left}
.theory b{color:var(--blue)}

.listen{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--blue);background:var(--surface);color:var(--blue);border-radius:99px;padding:6px 16px 6px 12px;font-weight:800;font-size:.95rem;cursor:pointer}
.listen svg{width:22px;height:22px;fill:currentColor}
.listen.playing{background:var(--blue);color:var(--on-blue)}
.listen{align-self:flex-start}
.center .listen{align-self:center}
.nosynth .listen{display:none}

.go{border:0;background:var(--blue);color:var(--on-blue);border-radius:12px;padding:12px 26px;font:700 1.25rem var(--font-display);cursor:pointer;box-shadow:0 4px 0 var(--blue-d)}
.go:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.go:disabled{opacity:.4;cursor:not-allowed}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{font-weight:700;color:var(--muted)}

.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:10px 14px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line);cursor:pointer;font-weight:700;min-width:0;text-align:center}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.55}
.opt.ok{border-color:var(--teal-d);background:var(--teal-soft);box-shadow:0 3px 0 var(--teal-d)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opts{display:grid;gap:10px}
.opts.words{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.words .opt{font-size:1.1rem}

.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 18px;font:700 1.1rem var(--font-display);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip .sw{width:22px;height:22px;border-radius:6px;border:2px solid var(--figline)}
.chip[aria-pressed="true"] .sw{border-color:var(--on-blue)}
.row2{display:flex;gap:10px;flex-wrap:wrap}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:var(--surface);border:2px solid var(--line);border-radius:12px;cursor:pointer;text-align:center;font-weight:700;box-shadow:0 3px 0 var(--line);min-width:0}
.card.seen{border-color:var(--teal-d)}
.card.seen::after{content:"\2713";position:absolute;top:4px;right:10px;color:var(--teal-d);font-weight:800}
.card .res{font-weight:700;min-height:3.1em}

.net{display:block;width:100%;height:auto;margin:0 auto}
.net rect{stroke:var(--figline);stroke-width:2;stroke-linejoin:round}
.net .ia{cursor:pointer}
.net .ia:focus-visible{outline:none;stroke:var(--ink);stroke-width:4}
.stimbox{display:flex;justify-content:center}
.stimbox svg{max-width:300px}

.svgbox{display:flex;justify-content:center;padding:6px 0}
.svgbox svg{display:block;width:100%;height:auto}
.iso .fl{fill:var(--floor);stroke:var(--figline);stroke-width:1.5}
.iso .t{fill:var(--cube-top)}
.iso .f{fill:var(--cube-front)}
.iso .r{fill:var(--cube-right)}
.iso .t,.iso .f,.iso .r{stroke:var(--figline);stroke-width:1.2;stroke-linejoin:round}
.iso text{fill:var(--muted);font:700 12px var(--font-body)}
.flat rect{fill:var(--c3);stroke:var(--figline);stroke-width:2}
.pair2{display:flex;gap:16px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.pair2 figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pair2 figcaption{font-size:.9rem;font-weight:600;color:var(--muted)}
.pair2 .a{flex:0 1 260px}
.pair2 .b{flex:0 1 150px}
.say{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

.wire{display:block;width:100%;height:auto;max-width:360px;margin:0 auto}
.wire .ev{stroke:var(--figline);stroke-width:6;stroke-linecap:round;fill:none}
.wire .he{stroke:transparent;stroke-width:26;stroke-linecap:round;fill:none;pointer-events:stroke;cursor:pointer}
.wire .vv{fill:var(--surface);stroke:var(--figline);stroke-width:4}
.wire .hv{fill:transparent;pointer-events:all;cursor:pointer}
.wire.m-r .hv{pointer-events:none}
.wire.m-v .he{pointer-events:none}
.wire .done{stroke:var(--hot)}
.wire .vv.done{fill:var(--hot-soft);stroke:var(--hot)}
.wire .lab{fill:var(--hot);font:800 17px var(--font-display);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:5px}
.wire .he:focus-visible,.wire .hv:focus-visible{outline:none;stroke:var(--ink);stroke-width:4}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;color:var(--muted);margin-bottom:10px}
.dots span{display:inline-block;width:12px;height:12px;margin-left:5px;border-radius:50%;background:var(--line)}
.dots .d{background:var(--teal)}
.dots .c{background:var(--blue)}
.qcard{display:flex;flex-direction:column;gap:14px}
.qtext{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.q{font:700 1.35rem/1.25 var(--font-display)}
.fb{min-height:1.5em;font-weight:800}
.fb.good{color:var(--teal-d)}
.fb.bad{color:var(--bad)}
.after{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.expl{background:var(--blue-soft);border-radius:10px;padding:10px 14px}

.kicker{font:700 1rem var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-d)}
.heroimgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:center;max-width:520px}
.plan{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:6px}
.plan li::marker{font-weight:800;color:var(--blue)}
.plan li{padding-left:6px}
.plan span{color:var(--muted);font-size:.95rem;margin-left:8px}
.field{display:flex;flex-direction:column;gap:4px;max-width:340px}
.field label{font-weight:700}
input[type=text]{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}

.stars{display:flex;gap:8px}
.stars svg{width:56px;height:56px;animation:pop .5s backwards}
.stars svg:nth-child(2){animation-delay:.15s}
.stars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.big{font-size:1.3rem}
.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;align-items:end}
.recap div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.9rem;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <a href="index.html" style="color:var(--muted,#56637f);font:700 15px/1.2 system-ui,sans-serif;text-decoration:none;align-self:flex-start">← Alle lessen</a>
  <header class="top" id="top">
    <span class="brand">Wiskunde · klas 1</span>
    <div class="tools">
      <label for="auto"><input type="checkbox" id="auto"> Lees alles voor</label>
      <span class="pts">Punten <span id="pts">0</span></span>
    </div>
  </header>
  <div class="prog" role="progressbar" aria-label="Voortgang van de les" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar"></span></div>
  <div class="stepname" id="stepname"></div>
  <main id="stage" tabindex="-1"></main>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};
var MAX=21;
var state={i:0,score:0,name:'',auto:false};

/* ---------- Voorlezen ---------- */
var synth=('speechSynthesis' in window)?window.speechSynthesis:null;
var voice=null,active=null,token=0;
if(!synth)$('#app').classList.add('nosynth');
function pickVoice(){if(!synth)return;var v=synth.getVoices();voice=v.find(function(x){return /^nl[-_]NL$/i.test(x.lang)})||v.find(function(x){return /^nl/i.test(x.lang)})||null}
if(synth){pickVoice();if('onvoiceschanged' in synth)synth.onvoiceschanged=pickVoice}
function clearActive(){if(active){active.classList.remove('playing');active=null}}
function stopSpeech(){token++;if(synth)synth.cancel();clearActive()}
function say(text,btn){
  if(!synth)return;
  var same=btn&&active===btn;
  stopSpeech();
  if(same)return;
  var my=++token;
  var u=new SpeechSynthesisUtterance(text);
  u.lang='nl-NL';if(voice)u.voice=voice;u.rate=.9;
  u.onend=u.onerror=function(){if(token===my)clearActive()};
  if(btn){active=btn;btn.classList.add('playing')}
  synth.speak(u);
}
function maybeAuto(t){if(state.auto)say(t,null)}
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function listenBtn(text,label){return '<button class="listen" type="button" data-say="'+esc(text)+'">'+SPK+'<span>'+(label||'Lees voor')+'</span></button>'}

/* ---------- Uitslagen ---------- */
function cells(list){return list.map(function(c){return {x:c[0],y:c[1],w:1,h:1,g:0}})}
var K1=cells([[0,1],[1,1],[2,1],[3,1],[1,0],[1,2]]);
var K2=cells([[0,1],[1,1],[2,1],[3,1],[2,0],[0,2]]);
var K3=cells([[0,0],[1,0],[1,1],[2,1],[2,2],[3,2]]);
/* Balk met lengte L, breedte W, hoogte H. Vier zijvlakken in een rij, boven- en onderkant ertegen. */
function balkNet(L,W,H,tv,bv,rot){
  var ws=[L,W,L,W],xs=[0,L,L+W,2*L+W],f=[];
  for(var i=0;i<4;i++)f.push({x:xs[i],y:W,w:ws[i],h:H,g:i%2});
  f.push({x:xs[tv],y:0,w:L,h:W,g:2});
  f.push({x:xs[bv],y:W+H,w:L,h:W,g:2});
  return rot?f.map(function(a){return {x:a.y,y:a.x,w:a.h,h:a.w,g:a.g}}):f;
}
var B1=balkNet(3,2,1,0,0,false);
var B2=balkNet(3,2,1,2,0,false);
var B3=balkNet(2,3,1,2,0,true);
var PAL=['var(--c1)','var(--c2)','var(--c3)'],PALN=['roze','groen','geel'];
function groupColors(kind,faces){
  var BG=['var(--c2)','var(--c3)','var(--c1)'];
  return faces.map(function(f){return kind==='kubus'?'var(--c1)':BG[f.g]});
}
function netSvg(faces,colors,interactive){
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  faces.forEach(function(f){minx=Math.min(minx,f.x);miny=Math.min(miny,f.y);maxx=Math.max(maxx,f.x+f.w);maxy=Math.max(maxy,f.y+f.h)});
  var W=maxx-minx,H=maxy-miny,u=Math.min(40,300/Math.max(W,H)),pad=3,vw=W*u+2*pad,vh=H*u+2*pad;
  var r=faces.map(function(f,i){
    var fill=colors&&colors[i]?colors[i]:'var(--fig)';
    return '<rect x="'+((f.x-minx)*u+pad)+'" y="'+((f.y-miny)*u+pad)+'" width="'+(f.w*u)+'" height="'+(f.h*u)+'" fill="'+fill+'"'+
      (interactive?' class="ia" data-i="'+i+'" tabindex="0" role="button" aria-label="Vlak '+(i+1)+'"':'')+'/>';
  }).join('');
  return '<svg class="net" viewBox="0 0 '+vw+' '+vh+'" style="max-width:'+Math.round(vw)+'px" role="img" aria-label="Een uitslag met zes grensvlakken">'+r+'</svg>';
}

/* ---------- Draadmodel van een balk ---------- */
var WA=3,WB=2,WC=1.3;
function wire(interactive){
  var s=42,c=.866;
  function P(x,y,z){return [(x+y)*c*s,-(z+(y-x)*.5)*s]}
  var V=[],i,k;
  for(i=0;i<8;i++)V.push(P((i&1)*WA,((i>>1)&1)*WB,((i>>2)&1)*WC));
  var E=[];
  for(i=0;i<8;i++)for(k=0;k<3;k++){var b=1<<k;if(!(i&b))E.push([i,i|b])}
  var xs=V.map(function(p){return p[0]}),ys=V.map(function(p){return p[1]});
  var minx=Math.min.apply(null,xs)-30,maxx=Math.max.apply(null,xs)+30,miny=Math.min.apply(null,ys)-40,maxy=Math.max.apply(null,ys)+34;
  var out='<svg class="wire m-r" viewBox="'+minx+' '+miny+' '+(maxx-minx)+' '+(maxy-miny)+'" role="img" aria-label="Draadmodel van een balk met alle ribben en hoekpunten">';
  E.forEach(function(e,n){
    var a=V[e[0]],bb=V[e[1]];
    out+='<line class="ev" id="ev'+n+'" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+bb[0]+'" y2="'+bb[1]+'"/>';
  });
  if(interactive)E.forEach(function(e,n){
    var a=V[e[0]],bb=V[e[1]];
    out+='<line class="he" data-e="'+n+'" tabindex="0" role="button" aria-label="Ribbe '+(n+1)+'" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+bb[0]+'" y2="'+bb[1]+'"/>';
  });
  V.forEach(function(p,n){out+='<circle class="vv" id="vv'+n+'" cx="'+p[0]+'" cy="'+p[1]+'" r="8"/>'});
  if(interactive)V.forEach(function(p,n){out+='<circle class="hv" data-v="'+n+'" tabindex="0" role="button" aria-label="Hoekpunt '+(n+1)+'" cx="'+p[0]+'" cy="'+p[1]+'" r="20"/>'});
  out+='<g id="labs"></g></svg>';
  wire.V=V;wire.E=E;
  return out;
}

/* ---------- Bouwwerken en aanzichten ---------- */
var STR=[[[3,1,0],[0,1,2]],[[1,2,2],[1,0,3]],[[1,0,2],[3,2,2]]];
function iso(h){
  var gy=h.length,gx=h[0].length,s=22,c=.866;
  function P(x,y,z){return [(x+y)*c*s,-(z+(y-x)*.5)*s]}
  function poly(cls,pts){return '<polygon class="'+cls+'" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>'}
  var all=[],cubes=[],x,y,z;

  all=all.concat(floor);

  cubes.forEach(function(q){
    var X=q.x,Y=q.y,Z=q.z;
    var top=[P(X,Y,Z+1),P(X+1,Y,Z+1),P(X+1,Y+1,Z+1),P(X,Y+1,Z+1)];
    var fr=[P(X,Y,Z),P(X+1,Y,Z),P(X+1,Y,Z+1),P(X,Y,Z+1)];
    var ri=[P(X+1,Y,Z),P(X+1,Y+1,Z),P(X+1,Y+1,Z+1),P(X+1,Y,Z+1)];

        '<text x="'+(m2[0]+10)+'" y="'+(m2[1]+22)+'" text-anchor="start">rechterkant</text>';
  return '<svg class="iso" viewBox="'+minx.toFixed(1)+' '+miny.toFixed(1)+' '+(maxx-minx).toFixed(1)+' '+(maxy-miny).toFixed(1)+'" role="img" aria-label="Een bouwwerk van blokken, gezien van schuin voor">'+body+'</svg>';

function maxOf(a){return Math.max.apply(null,a)}

    '<div class="svgbox" style="max-width:300px;margin:0 auto">'+iso(h)+'</div>'+
    '<div class="row2" role="group" aria-label="Kies een aanzicht">'+['voor','zij','boven'].map(function(v){return '<button class="chip" type="button" data-v="'+v+'" aria-pressed="false">'+VN[v]+'</button>'}).join('')+'</div>'+
    '<div class="say" id="show" aria-live="polite"><p class="muted">Tik op een aanzicht.</p></div></div>'+
    '<div class="foot"><span class="count">Bekeken: <b id="cnt">0</b> van 3</span><button class="go" type="button" data-next id="nx" disabled>Verder</button></div></section>';
  root.querySelectorAll('[data-v]').forEach(function(b){
    b.onclick=function(){
      var v=b.dataset.v;
      root.querySelectorAll('[data-v]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
      if(!seen[v]){seen[v]=1;count++;$('#cnt').textContent=count;if(count===3)$('#nx').disabled=false}
      var d=viewRows(h,v),tx=viewText(h,v);
      $('#show').innerHTML='<h3>'+VN[v]+'</h3><div style="width:100%;max-width:170px">'+flatSvg(d.rows,VN[v])+'</div><p>'+tx+'</p>'+listenBtn(VN[v]+'. '+tx,'Nog een keer');
      say(VN[v]+'. '+tx,null);
    };
  });
  maybeAuto(t);
}

function s7(root){
  var items=[];
  STR.forEach(function(h,si){['voor','zij','boven'].forEach(function(v){items.push({h:h,v:v})})});
  items=shuffle(items).slice(0,6);
  root.innerHTML='<section class="panel stack"><h2>Oefening: welk aanzicht?</h2><div id="q"></div></section>';
  var EX={voor:'Je kijkt van voren. Je ziet de hoogte van elke kolom, van links naar rechts.',zij:'Je kijkt vanaf de rechterkant. Links in het plaatje zit de voorkant.',boven:'Je kijkt van boven. Je ziet waar blokken staan. Onderin het plaatje zit de voorkant.'};
  quiz($('#q',root),{
    items:items,cls:'words',
    stim:function(it){return '<div class="pair2"><figure class="a">'+iso(it.h)+'<figcaption>Het bouwwerk</figcaption></figure><figure class="b">'+flatSvg(viewRows(it.h,it.v).rows,'Een aanzicht van het bouwwerk')+'<figcaption>Dit aanzicht</figcaption></figure></div>'},
    q:function(){return 'Welk aanzicht is dit plaatje?'},
    say:function(){return 'Kijk naar het bouwwerk en naar het plaatje. Welk aanzicht is dit plaatje?'},
    opts:function(){return ['voor','zij','boven'].map(function(v){return {id:v,html:VN[v]}})},
    correct:function(it){return it.v},
    wrong:function(){return 'Nee, dat is het niet.'},
    explain:function(it){return 'Dit is het '+VN[it.v].toLowerCase()+'. '+EX[it.v]}
  },next);
}

function star(on){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z" fill="'+(on?'var(--sun)':'var(--line)')+'" stroke="'+(on?'#b88400':'var(--muted)')+'" stroke-width="1.2" stroke-linejoin="round"/></svg>'}
function s8(root){
  var pct=state.score/MAX,stars=pct>=.85?3:pct>=.6?2:1;
  var nm=state.name?', '+esc(state.name):'';
  var say1='Goed gedaan'+(state.name?', '+state.name:'')+'! Je hebt '+state.score+' van de '+MAX+' punten.';
  root.innerHTML='<section class="panel stack center"><h2>Goed gedaan'+nm+'!</h2>'+
    '<div class="stars" role="img" aria-label="'+stars+' van de 3 sterren">'+[1,2,3].map(function(n){return star(n<=stars)}).join('')+'</div>'+
    '<p class="big">Je hebt <b>'+state.score+'</b> van de <b>'+MAX+'</b> punten.</p>'+listenBtn(say1)+
    '<div class="theory"><span class="tab">Dit heb je geleerd</span>'+
    '<p>Een <b>uitslag</b> is een bouwplaat zonder plakranden. Bij een kubus zijn alle zes de grensvlakken gelijk. Bij een balk zijn ze twee aan twee gelijk.</p>'+
    '<p>De zijden van grensvlakken heten <b>ribben</b>. De punten waar ribben bij elkaar komen heten <b>hoekpunten</b>. Een balk heeft 12 ribben en 8 hoekpunten.</p>'+
    '<p>Een <b>vooraanzicht</b>, <b>zijaanzicht</b> en <b>bovenaanzicht</b> laten zien hoe een ruimtefiguur er van voren, van opzij en van boven uitziet.</p>'+
    '<div class="recap"><div>'+netSvg(B1,groupColors('balk',B1),false)+'Uitslag</div><div>'+wire(false)+'Draadmodel</div><div>'+flatSvg(viewRows(STR[0],'voor').rows,'Vooraanzicht')+'Vooraanzicht</div></div></div>'+
    '<button class="go" type="button" id="again">Begin opnieuw</button></section>';
  $('#again').onclick=function(){state.score=0;go(0)};
  maybeAuto(say1);
}

var STEPS=[
  {name:'Start',fn:s0},
  {name:'Uitslag van kubus en balk',fn:s1},
  {name:'Oefening: kubus of balk?',fn:s2},
  {name:'Oefening: kleur de uitslag',fn:s3},
  {name:'Ribben en hoekpunten',fn:s4},
  {name:'Oefening: ribben en hoekpunten',fn:s5},
  {name:'Aanzichten',fn:s6},
  {name:'Oefening: welk aanzicht?',fn:s7},
  {name:'Klaar',fn:s8}
];
function go(i){
  stopSpeech();state.i=i;head();
  STEPS[i].fn($('#stage'));
  $('#top').scrollIntoView();
  $('#stage').focus({preventScroll:true});
}

document.addEventListener('click',function(e){
  var l=e.target.closest('.listen');
  if(l){say(l.dataset.say,l);return}
  var nx=e.target.closest('[data-next]');
  if(nx&&!nx.disabled){var nm=$('#naam');if(nm)state.name=nm.value.trim();go(state.i+1)}
});
$('#auto').onchange=function(e){state.auto=e.target.checked;if(!state.auto)stopSpeech()};

go(0);
})();
</script>

</body></html>
